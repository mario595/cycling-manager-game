name: Beta testers

# The LLM beta testers (#132; beta_agents/README.md). The testers whose last
# diary entry is old enough visit the staging world one after another, and
# each one's diary is committed to the beta-diaries branch.
#
# Two things start a run (#160). The staging machine checks the diaries every
# hour and dispatches this workflow with `tester: due` when someone is due
# (`python -m beta_agents dispatch`, deploy/crontab). GitHub's own hourly
# schedule below is the backup: it fires only when GitHub has room, about one
# hour in eight in practice. Either way, dueness is read from the diaries.
#
# Pause them all: set the repository variable BETA_AGENTS_ENABLED to anything
# but "true". That pauses the machine's `due` runs too. A manual run of one
# named tester still works while paused.
#
# Scheduled workflows run only from the default branch, so this starts once it
# is merged to master.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tester:
        description: "One tester to visit now, or `due` for whoever is due (what the staging machine sends)"
        required: true
        type: choice
        default: due
        options: [due, youth, trader, money, racer, casual]

# One run at a time: a visit is never interrupted, and two runs never write
# the diary branch at once.
concurrency:
  group: beta-agents
  cancel-in-progress: false

permissions:
  contents: write  # the beta-diaries branch only

jobs:
  visit:
    if: vars.BETA_AGENTS_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tester != 'due')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Check out the diaries
        run: |
          if git ls-remote --exit-code --heads origin beta-diaries > /dev/null; then
            git fetch origin beta-diaries
            git worktree add diary FETCH_HEAD
            git -C diary checkout -B beta-diaries
          else
            git worktree add --orphan -b beta-diaries diary
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Visit
        env:
          BETA_BASE_URL: ${{ vars.BETA_BASE_URL }}
          BETA_LLM_BASE_URL: ${{ vars.BETA_LLM_BASE_URL }}
          BETA_LLM_MODEL: ${{ vars.BETA_LLM_MODEL }}
          BETA_LLM_MIN_INTERVAL: ${{ vars.BETA_LLM_MIN_INTERVAL }}
          BETA_MAX_STEPS: ${{ vars.BETA_MAX_STEPS }}
          BETA_LLM_API_KEY: ${{ secrets.BETA_LLM_API_KEY }}
          BETA_KEY_YOUTH: ${{ secrets.BETA_KEY_YOUTH }}
          BETA_KEY_TRADER: ${{ secrets.BETA_KEY_TRADER }}
          BETA_KEY_MONEY: ${{ secrets.BETA_KEY_MONEY }}
          BETA_KEY_RACER: ${{ secrets.BETA_KEY_RACER }}
          BETA_KEY_CASUAL: ${{ secrets.BETA_KEY_CASUAL }}
          ONE_TESTER: ${{ inputs.tester }}
        run: |
          if [ -n "$ONE_TESTER" ] && [ "$ONE_TESTER" != due ]; then due="$ONE_TESTER"; else due=$(python -m beta_agents due --diary-dir diary); fi
          echo "Due: ${due:-nobody}"
          failed=0
          for tester in $due; do
            python -m beta_agents visit "$tester" --diary-dir diary || failed=1
          done
          exit $failed

      - name: Commit the diaries
        if: always()
        run: |
          cd diary
          git add -A
          if git diff --cached --quiet; then echo "No diary changes."; exit 0; fi
          git -c user.name="beta-testers" -c user.email="beta-testers@users.noreply.github.com" \
            commit -q -m "Diaries after the $(date -u +%H:%M) UTC visits"
          git push origin beta-diaries
