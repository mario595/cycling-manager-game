[project]
name = "cycling-manager"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
# race_engine tests are plain pytest and need no database; the Django app
# tests get one via pytest-django's fixtures.
testpaths = ["race_engine", "core", "accounts", "riders", "teams", "transfers", "staff", "economy", "schedule", "racing", "competitions", "feedback", "world", "api", "deploy"]
python_files = ["test_*.py", "tests.py"]
